<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Hub</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #fafafa; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; width: 100%; position: relative; z-index: 10; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 90%; max-width: 500px; margin-bottom: 20px; box-sizing: border-box; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #e0e0e0; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        button { display: block; padding: 14px 30px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; box-sizing: border-box;}
        .bot-btn { padding: 12px 30px; font-size: 16px; background: #1a1a1a; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        #result-link { margin-top: 25px; padding: 15px; background: #f0f7ff; border: 1px solid #bae7ff; border-radius: 6px; display: none; word-break: break-all; font-size: 16px; }
        #assignment-banner { display: none; width: 100%; text-align: center; color: #666; font-size: 14px; font-weight: bold; background: #e6ffed; padding: 10px 0; border-bottom: 1px solid #b7eb8f; position: absolute; top: 0; left: 0; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; display: none; position: absolute; top: 0; left: 0; z-index: 5; background: #fff; }
    </style>
</head>
<body>
    <!-- Disguise Session Banner -->
    <div id="assignment-banner"></div>
    
    <!-- Proxy View Matrix Frame -->
    <iframe id="viewFrame"></iframe>

    <!-- Main Generator UI Wrapper -->
    <div id="mainUI" class="wrapper">
        <div class="container">
            <h2 id="search-title">Resource Search</h2>
            <input type="text" id="urlInput" placeholder="Type website link here (e.g. wikipedia.org)..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <div class="container">
            <h2>Proxy Clone Bot</h2>
            <p style="color: #666; font-size: 14px;">Click below to instantly generate a completely new web link that mirrors this exact searchbar.</p>
            <button class="bot-btn" id="cloneBtn">🤖 Generate New Educational Link</button>
            <div id="result-link"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeAssignment = urlParams.get('assignment');
        const activeSearch = urlParams.get('q');
        
        // If an educational parameter exists, change the layout names instantly
        if (activeAssignment) {
            const banner = document.getElementById('assignment-banner');
            banner.style.display = "block";
            banner.innerText = '📚 Active Session: ' + activeAssignment.toUpperCase();
            document.getElementById('search-title').innerText = "Workspace Database Search";
        }

        // If a proxy search string parameter exists, run the target unblocked frame automatically
        if (activeSearch) {
            document.getElementById('mainUI').style.display = "none";
            const frame = document.getElementById('viewFrame');
            frame.style.display = "block";
            
            // Pipes traffic through a secure text display mirror engine node
            frame.src = "https://duckduckgo.com" + encodeURIComponent(activeSearch);
        }

        document.getElementById('searchBtn').onclick = function() {
            let target = document.getElementById('urlInput').value.trim();
            if (!target) return;

            // Automatically format inputs into clean web links
            if (!target.includes('.')) {
                target = 'https://google.com' + encodeURIComponent(target);
            } else if (!/^https?:\/\//i.test(target)) {
                target = 'https://' + target;
            }

            const subs = ['algebra-workbook', 'geometry-proofs', 'calculus-limits', 'history-archive', 'literature-notes', 'chemistry-lab', 'biology-cells'];
            const randomSubject = subs[Math.floor(Math.random() * subs.length)] + '-' + Math.floor(1000 + Math.random() * 9000);

            // Force in-tab redirection to update the browser address bar cleanly
            const factoryPath = window.location.origin + window.location.pathname;
            window.location.href = factoryPath + '?assignment=' + randomSubject + '&q=' + encodeURIComponent(target);
        };
        
        document.getElementById('cloneBtn').onclick = function() {
            const div = document.getElementById('result-link');
            div.style.display = "block";
            const subs = ['algebra-workbook', 'geometry-proofs', 'calculus-limits', 'history-archive', 'literature-notes', 'chemistry-lab', 'biology-cells'];
            const randomSubject = subs[Math.floor(Math.random() * subs.length)] + '-' + Math.floor(1000 + Math.random() * 9000);
            const currentUrl = window.location.origin + window.location.pathname;
            const newLink = currentUrl + '?assignment=' + randomSubject;
            div.innerHTML = '<strong>New Link Created!</strong><br><br><a href="' + newLink + '" target="_self" style="color: #0070f3; font-weight: bold; text-decoration: none;">' + newLink + '</a>';
        }
    </script>
</body>
</html>
