     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Hub - Database Portal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #1e293b; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; width: 100%; box-sizing: border-box; padding: 20px; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 90%; max-width: 500px; margin-bottom: 20px; box-sizing: border-box; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #e0e0e0; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; outline: none; background: #f8fafc; color: #1e293b; }
        input[type="text"]:focus { border-color: #0070f3; background: white; }
        button { display: block; padding: 14px 30px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; box-sizing: border-box; transition: background 0.2s; }
        button:hover { background: #0060d0; }
        .bot-btn { padding: 12px 30px; font-size: 16px; background: #1a1a1a; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .bot-btn:hover { background: #000; }
        #result-link { margin-top: 25px; padding: 15px; background: #f0f7ff; border: 1px solid #bae7ff; border-radius: 6px; display: none; word-break: break-all; font-size: 15px; text-align: left; }
        #assignment-banner { display: none; width: 100%; text-align: center; color: #666; font-size: 14px; font-weight: bold; background: #e6ffed; padding: 10px 0; border-bottom: 1px solid #b7eb8f; position: fixed; top: 0; left: 0; z-index: 100; }
        
        /* Unblocked View Panel Layout */
        .results-panel { display: none; max-width: 800px; width: 90%; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 40px; margin: 80px auto 40px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.03); box-sizing: border-box; }
        .results-title { font-size: 28px; margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .results-body { font-size: 16px; line-height: 1.7; color: #334155; }
        .results-body p { margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Disguise Session Banner -->
    <div id="assignment-banner"></div>
    
    <!-- Unblocked Dynamic Data Display View -->
    <div id="resultsView" class="results-panel">
        <h1 id="outputTitle" class="results-title">Loading Resource Document...</h1>
        <div id="outputContent" class="results-body"></div>
        <button onclick="window.location.search=''" style="background: #64748b; margin-top: 30px; width: auto; display: inline-block;">Return to Core Hub</button>
    </div>

    <!-- Main Generator UI Wrapper -->
    <div id="mainUI" class="wrapper">
        <div class="container">
            <h2 id="search-title">Resource Search</h2>
            <input type="text" id="urlInput" placeholder="Type target keyword or topic (e.g., space, physics)..." autocomplete="off">
            <button id="searchBtn">Execute Research Pipeline</button>
        </div>

        <div class="container">
            <h2>Proxy Clone Bot</h2>
            <p style="color: #666; font-size: 14px;">Click below to instantly generate a completely new web link that mirrors this exact searchbar.</p>
            <button class="bot-btn" id="cloneBtn">🤖 Replicate Workspace Framework Node</button>
            <div id="result-link"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeAssignment = urlParams.get('assignment');
        const activeSearch = urlParams.get('q');
        
        // Step A: Re-configure dashboard display if assignment tracking parameters exist
        if (activeAssignment) {
            const banner = document.getElementById('assignment-banner');
            banner.style.display = "block";
            banner.innerText = '📚 Active Session: ' + activeAssignment.toUpperCase();
            document.getElementById('search-title').innerText = "Workspace Database Search";
        }

        // Step B: Fetch unblocked resource layout text through the API data gateway natively
        if (activeSearch) {
            document.getElementById('mainUI').style.display = "none";
            document.getElementById('resultsView').style.display = "block";
            
            fetchWikiData(activeSearch);
        }

        async function fetchWikiData(query) {
            const cleanQuery = query.replace(/https?:\\/\\/(www\\.)?/, '').replace(/\\..*$/, '');
            const endpoint = `https://wikipedia.org{encodeURIComponent(cleanQuery)}&origin=*`;
            
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                
                if (pageId !== "-1") {
                    document.getElementById('outputTitle').innerText = pages[pageId].title;
                    document.getElementById('outputContent').innerHTML = "<p>" + pages[pageId].extract.replace(/\\n/g, "</p><p>") + "</p>";
                } else {
                    // Fallback to general lookup search array if direct title mismatch occurs
                    const searchFallback = `https://wikipedia.org{encodeURIComponent(cleanQuery)}&origin=*`;
                    const fallRes = await fetch(searchFallback);
                    const fallData = await fallRes.json();
                    
                    if (fallData[1] && fallData[1].length > 0) {
                        document.getElementById('outputTitle').innerText = `Search Indexes for: "${cleanQuery}"`;
                        let listHtml = "<ul>";
                        for (let i = 0; i < fallData[1].length; i++) {
                            listHtml += `<li><strong>${fallData[1][i]}</strong>: ${fallData[2][i] || 'Reference context available.'}</li>`;
                        }
                        listHtml += "</ul>";
                        document.getElementById('outputContent').innerHTML = listHtml;
                    } else {
                        document.getElementById('outputTitle').innerText = "Database Node Empty";
                        document.getElementById('outputContent').innerText = "No unblocked data packets matching your search parameters could be extracted.";
                    }
                }
            } catch (err) {
                document.getElementById('outputTitle').innerText = "Network Tracing Fault";
                document.getElementById('outputContent').innerText = "Connection lost at server gateway: " + err.message;
            }
        }

        document.getElementById('searchBtn').onclick = function() {
            let target = document.getElementById('urlInput').value.trim();
            if (!target) return;

            const subs = ['algebra-workbook', 'geometry-proofs', 'calculus-limits', 'history-archive', 'literature-notes', 'chemistry-lab', 'biology-cells'];
            const randomSubject = subs[Math.floor(Math.random() * subs.length)] + '-' + Math.floor(1000 + Math.random() * 9999);

            // Step C: Force in-tab redirection to update your address bar with your custom assignment mask link
            const factoryPath = window.location.origin + window.location.pathname;
            window.location.href = factoryPath + '?assignment=' + randomSubject + '&q=' + encodeURIComponent(target);
        };
        
        document.getElementById('cloneBtn').onclick = function() {
            const div = document.getElementById('result-link');
            div.style.display = "block";
            const subs = ['algebra-workbook', 'geometry-proofs', 'calculus-limits', 'history-archive', 'literature-notes', 'chemistry-lab', 'biology-cells'];
            const randomSubject = subs[Math.floor(Math.random() * subs.length)] + '-' + Math.floor(1000 + Math.random() * 9999);
            const currentUrl = window.location.origin + window.location.pathname;
            const newLink = currentUrl + '?assignment=' + randomSubject;
            div.innerHTML = '<strong>New Link Created!</strong><br><br><a href="' + newLink + '" target="_self" style="color: #0070f3; font-weight: bold; text-decoration: none;">' + newLink + '</a>';
        };
    </script>
</body>
</html>
